name: Deploy Agent Shelf to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test published Markdown
        shell: bash
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          url="${base%/}/skills/svg-vector/svg-authoring/SKILL.md"
          echo "Checking $url"
          for attempt in {1..12}; do
            if body="$(curl --fail --silent --show-error --location --max-time 15 "$url")" && grep -q '^# SVG Authoring' <<<"$body"; then
              echo "Published Markdown is reachable and intact."
              exit 0
            fi
            echo "Attempt $attempt failed; waiting for Pages propagation..."
            sleep 5
          done
          echo "Published Markdown smoke test failed."
          exit 1
